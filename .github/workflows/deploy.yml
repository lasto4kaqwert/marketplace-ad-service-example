name: Deploy to LMS

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-lms-main
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          REPOSITORY_LOWER=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPOSITORY_LOWER}:${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Send deploy request
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          REPOSITORY: ${{ github.repository }}
          LMS_API_KEY: ${{ secrets.LMS_API_KEY }}
        run: |
          if [ -z "$LMS_API_KEY" ]; then
            echo "LMS_API_KEY is not configured"
            exit 1
          fi

          REQUEST_BODY=$(printf \
            '{"image":"%s","repository":"%s"}' \
            "$IMAGE" \
            "$REPOSITORY")

          HTTP_CODE=$(curl -sS \
            -o response.txt \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${LMS_API_KEY}" \
            --data "$REQUEST_BODY" \
            "https://api.platform.python-labs.ru/api/deploy-requests")

          echo "LMS response status: $HTTP_CODE"
          cat response.txt

          if [[ "$HTTP_CODE" != 2* ]]; then
            echo "Deployment request failed"
            exit 1
          fi
          